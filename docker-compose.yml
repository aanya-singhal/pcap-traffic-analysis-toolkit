# Live-capture demo: three containers with host visibility.
#
#   receiver  - runs the dashboard with network_mode: "host" so it can view
#               and capture real physical interfaces (wlo1, etc.) as well as
#               Docker bridge interfaces (docker0, br-*, lo, any).
#   attacker  - loops an nmap port scan + an SSH brute-force burst targeting
#               the receiver via the host gateway.
#   client    - loops normal web requests at receiver (benign baseline).

services:
  receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcap-receiver
    network_mode: "host"
    environment:
      PORT: "5001"
      CAPTURE_SECONDS: "15"
    # TShark/dumpcap needs raw network socket capabilities
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./toolkit.db:/app/toolkit.db
      - ./uploads:/app/uploads

  attacker:
    build:
      context: .
      dockerfile: docker/attacker.Dockerfile
    container_name: pcap-attacker
    command: ["/attacker.sh"]
    environment:
      TARGET: receiver
    extra_hosts:
      - "receiver:host-gateway"
    # nmap -sS (SYN scan) needs raw sockets.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - receiver
    networks:
      - lab

  client:
    build:
      context: .
      dockerfile: docker/attacker.Dockerfile
    container_name: pcap-client
    command: ["/client.sh"]
    environment:
      TARGET: receiver
      PORT: "5001"
    extra_hosts:
      - "receiver:host-gateway"
    depends_on:
      - receiver
    networks:
      - lab

networks:
  lab:
    driver: bridge
